<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Dictionary</title>
</head>

<body>

    <nav>
        <div class="logo">
            <h1>Spanish Dictionary</h1>
        </div>

        <p id="time"></p>

        <div class="navitems">
            <div class="navitem">
                <a href="/index.html">Home</a>
            </div>

            <div class="navitem">
                <a href="/emulator.html">Emulator</a>
            </div>

            <div class="navitem">
                <a href="/search.html">Search</a>
            </div>
        </div>
    </nav>

    <div class="center-container">
        <h1>Search</h1>

        <input class="pxyinput" type="text" placeholder="Search for any spanish word..." autocomplete="off">
    </div>

    <iframe class="frame" style="display: none;"></iframe>


    <!-- Search JavaScript -->
    <script>

        const frame = document.querySelector(".frame");
        const div = document.querySelector(".center-container");
        const input = document.querySelector(".pxyinput");

        frame.style.display = "none";

        input.addEventListener("keyup", function (event) {

            if (event.key === "Enter") {

                div.style.display = "none";
                frame.style.display = "block";

                const url = search(input.value);

                /*
                 * This normally used:
                 *
                 * __uv$config.prefix +
                 * __uv$config.encodeUrl(url)
                 *
                 * Since the UV files have been removed,
                 * this simply loads the resulting URL directly.
                 */

                frame.src = url;
            }

        });


        const params = new URLSearchParams(window.location.search);

        console.log(
            "Searching for " + params.get("q")
        );


        if (params.get("q")) {

            div.style.display = "none";
            frame.style.display = "block";

            const url = search(params.get("q"));

            frame.src = url;

        }


        function search(input) {

            // Check for a complete URL
            try {

                return new URL(input).toString();

            } catch (err) {

                // Not a complete URL

            }


            // Try adding http://
            try {

                const url = new URL(`http://${input}`);

                if (url.hostname.includes(".")) {

                    return url.toString();

                }

            } catch (err) {

                // Not a valid URL

            }


            // Treat it as a Google search
            return `https://www.google.com/search?q=${encodeURIComponent(input)}`;

        }

    </script>

</body>

</html>
